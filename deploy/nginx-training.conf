# Reference copy of the server blocks for training.prasanthebenezer.com.
# The live config is in nginx.conf of the prasanthebenezer.github.io repo; that file is the source of truth.
# Reconstructed from docs/DEPLOY.md: replace this with the live blocks so the two match.

server {
    listen 80;
    server_name training.prasanthebenezer.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }   # certbot webroot (check path)
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name training.prasanthebenezer.com;

    ssl_certificate     /etc/letsencrypt/live/training.prasanthebenezer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/training.prasanthebenezer.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 500M;              # video uploads

    location / {
        proxy_pass http://training:8000;    # alias from docker-compose.override.yml
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, so clients cannot spoof the recorded IP
        proxy_request_buffering off;        # stream large uploads
        proxy_read_timeout 300s;
    }
}
